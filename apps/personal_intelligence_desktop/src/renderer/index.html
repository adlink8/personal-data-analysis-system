<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>个人智能 · 对话</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#thread">跳到对话主区</a>

  <div class="shell">
    <!-- 232px fixed left navigation: new conversation / recent / project scopes,
         bottom personal model and system entries. -->
    <aside class="nav" aria-label="导航">
      <div class="nav-top">
        <button id="new-conversation" class="nav-primary" type="button">新建对话</button>
      </div>
      <section class="nav-section" aria-labelledby="recent-heading">
        <h2 id="recent-heading" class="nav-heading">最近对话</h2>
        <ul id="recent-list" class="nav-list"></ul>
      </section>
      <section class="nav-section" aria-labelledby="scopes-heading">
        <h2 id="scopes-heading" class="nav-heading">项目</h2>
        <ul id="scope-list" class="nav-list"></ul>
      </section>
      <div class="nav-bottom">
        <button id="personal-model" class="nav-link" type="button">个人模型</button>
        <button id="system" class="nav-link" type="button">系统</button>
      </div>
    </aside>

    <!-- Central conversation thread, 760-820px reading width, fixed composer. -->
    <main class="main" id="thread" tabindex="-1">
      <header class="thread-header">
        <h1 id="thread-title" class="thread-title">从一段对话开始。</h1>
        <div id="thread-meta" class="thread-meta"></div>
      </header>
      <div class="thread-scroll">
        <div id="messages" class="messages"></div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="composer-input" rows="1" placeholder="继续这段对话…" aria-label="继续这段对话"></textarea>
          <button id="send" type="submit" class="btn-primary">发送消息</button>
        </form>
        <p class="composer-note">仅使用已授权资料；结果会标注依据、新鲜度与限制。</p>
      </div>
    </main>
  </div>

  <!-- Overlay layers: palette -> drawer -> modal (strict LIFO Esc order). -->
  <div id="command-palette" class="layer palette" hidden role="dialog" aria-label="命令面板">
    <h2 class="layer-title">命令面板 <span class="muted">Ctrl/Cmd+K</span></h2>
    <ul id="palette-commands" class="palette-commands"></ul>
  </div>

  <div id="proactive-drawer" class="layer drawer" hidden role="dialog" aria-label="主动提醒">
  </div>

  <div id="projection-drawer" class="layer drawer" hidden role="dialog" aria-label="派生个人模型">
  </div>

  <div id="receipt-drawer" class="layer drawer" hidden role="dialog" aria-label="查看 receipt">
  </div>

  <div id="evidence-drawer" class="layer drawer" hidden role="dialog" aria-label="候选证据">
  </div>

  <div id="candidate-edit" class="layer drawer" hidden role="dialog" aria-label="编辑候选">
  </div>

  <div id="confirm-modal" class="layer modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-desc">
  </div>

  <div id="conflict-modal" class="layer modal" hidden role="dialog" aria-modal="true" aria-label="解决候选冲突">
  </div>

  <button id="command-palette-trigger" class="visually-hidden" type="button">打开命令面板</button>
  <div id="live-region" class="visually-hidden" aria-live="polite"></div>
  <div id="alert-region" class="visually-hidden" role="alert"></div>
</body>
</html>
