<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Browser</title>
  <style>
    :root {
      color: #17202a;
      background: #f7f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; }
    main { display: grid; gap: 12px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0; }
    .summary { color: #516070; font-size: 13px; margin-top: 4px; }
    .toolbar, .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: end;
    }
    label { display: grid; gap: 4px; color: #516070; font-size: 12px; }
    input, select, button {
      min-height: 32px;
      border: 1px solid #c9d1dc;
      border-radius: 6px;
      padding: 5px 8px;
      background: #fff;
      color: #17202a;
      font: inherit;
    }
    input { min-width: 150px; }
    button { cursor: pointer; font-weight: 650; }
    button.primary { background: #2f6feb; color: #fff; border-color: #2f6feb; }
    button:disabled { opacity: 0.6; cursor: default; }
    .surface {
      border: 1px solid #dbe1e8;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .status {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f5;
      color: #516070;
      font-size: 13px;
    }
    .table-wrap { overflow: auto; }
    table { width: 100%; min-width: 760px; border-collapse: collapse; }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th { color: #516070; background: #fbfcfe; font-size: 12px; font-weight: 700; position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    td { overflow-wrap: anywhere; }
    pre {
      margin: 0;
      padding: 12px;
      max-height: 420px;
      overflow: auto;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      background: #fbfcfe;
    }
    .empty {
      padding: 28px;
      text-align: center;
      color: #647386;
      border: 1px dashed #c9d1dc;
      border-radius: 8px;
      background: #fff;
    }
    @media (max-width: 720px) {
      body { padding: 10px; }
      .toolbar, .filters { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
      label, input, select, button { width: 100%; min-width: 0; }
      table { min-width: 620px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Data Browser</h1>
        <div id="summary" class="summary">Waiting for bridge data.</div>
      </div>
      <div class="toolbar">
        <label>View
          <select id="view">
            <option value="events">Events</option>
            <option value="memories">Memories</option>
            <option value="relations">Relations</option>
            <option value="aggregate">Aggregate</option>
            <option value="timeline">Timeline</option>
            <option value="quality">Quality</option>
          </select>
        </label>
        <label>Limit
          <input id="limit" type="number" min="1" max="500" value="25">
        </label>
        <label>Offset
          <input id="offset" type="number" min="0" value="0">
        </label>
        <button id="load" class="primary" type="button">Load</button>
      </div>
    </header>
    <section class="filters">
      <label>Query / subject
        <input id="query" placeholder="Codex, GPT, project">
      </label>
      <label>Source
        <select id="source">
          <option value="">All</option>
          <option value="Agent">Agent</option>
          <option value="Google">Google</option>
          <option value="GPT">GPT</option>
        </select>
      </label>
      <label>Service
        <input id="service" placeholder="ChatGPT, Codex">
      </label>
      <label>Category
        <input id="category" placeholder="programming">
      </label>
      <label>Relation status
        <select id="status">
          <option value="all">All</option>
          <option value="review">Review</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </label>
      <label>Group
        <select id="groupBy">
          <option value="source">Source</option>
          <option value="month">Month</option>
          <option value="service">Service</option>
          <option value="category">Category</option>
          <option value="memory_type">Memory type</option>
          <option value="relation_type">Relation type</option>
        </select>
      </label>
    </section>
    <section class="surface">
      <div id="statusLine" class="status">No data loaded.</div>
      <div id="content"></div>
    </section>
  </main>

  <script>
    const state = { config: {}, data: null, loading: false, requestId: 1, pending: new Map() };
    const viewEl = document.getElementById("view");
    const limitEl = document.getElementById("limit");
    const offsetEl = document.getElementById("offset");
    const queryEl = document.getElementById("query");
    const sourceEl = document.getElementById("source");
    const serviceEl = document.getElementById("service");
    const categoryEl = document.getElementById("category");
    const statusEl = document.getElementById("status");
    const groupByEl = document.getElementById("groupBy");
    const loadEl = document.getElementById("load");
    const summaryEl = document.getElementById("summary");
    const statusLineEl = document.getElementById("statusLine");
    const contentEl = document.getElementById("content");

    function text(value, fallback = "") {
      return value === undefined || value === null || value === "" ? fallback : String(value);
    }

    function numberValue(input, fallback) {
      const value = Number.parseInt(input.value, 10);
      return Number.isFinite(value) ? value : fallback;
    }

    function commonArgs() {
      return {
        limit: numberValue(limitEl, 25),
        offset: numberValue(offsetEl, 0),
        source: sourceEl.value || undefined,
        service: serviceEl.value || undefined,
        category: categoryEl.value || undefined,
        keyword: queryEl.value.trim() || undefined
      };
    }

    function buildCall() {
      const view = viewEl.value;
      const args = commonArgs();
      if (view === "events") {
        return { name: "data_list_events", args: { ...args, fields: "event_id,source,event_time,title,service,category_v2", order: "desc" } };
      }
      if (view === "memories") {
        return { name: "data_list_memories", args: { limit: args.limit, offset: args.offset, memory_type: undefined, subject_like: args.keyword } };
      }
      if (view === "relations") {
        return { name: "data_list_relations", args: { limit: args.limit, offset: args.offset, subject: args.keyword, status: statusEl.value || "all" } };
      }
      if (view === "aggregate") {
        return { name: "data_aggregate", args: { ...args, group_by: groupByEl.value || "source" } };
      }
      if (view === "timeline") {
        return { name: "data_timeline", args: { ...args, subject: args.keyword, bucket: "month" } };
      }
      return { name: "data_quality_report", args: {} };
    }

    async function callTool(name, args) {
      if (window.openai && typeof window.openai.callTool === "function") {
        const result = await window.openai.callTool(name, args);
        return result && (result.structuredContent || result);
      }
      const id = state.requestId++;
      const payload = { jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } };
      return new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => {
          state.pending.delete(id);
          reject(new Error("Bridge tools/call timed out"));
        }, 15000);
        state.pending.set(id, { resolve, reject, timeout });
        window.parent.postMessage(payload, "*");
      });
    }

    async function loadData() {
      const { name, args } = buildCall();
      state.loading = true;
      renderLoading(name);
      try {
        const data = await callTool(name, args);
        setData(data, name);
      } catch (error) {
        setData({ ok: false, error: error instanceof Error ? error.message : String(error) }, name);
      } finally {
        state.loading = false;
        if (window.openai && typeof window.openai.setWidgetState === "function") {
          window.openai.setWidgetState({ view: viewEl.value, query: queryEl.value, source: sourceEl.value });
        }
      }
    }

    function setConfig(config) {
      state.config = config || {};
      if (state.config.view) viewEl.value = state.config.view;
      const filters = state.config.initialFilters || {};
      if (filters.query) queryEl.value = filters.query;
      if (filters.source) sourceEl.value = filters.source;
      if (filters.service) serviceEl.value = filters.service;
      if (filters.category) categoryEl.value = filters.category;
      summaryEl.textContent = `Bridge ready. ${Array.isArray(state.config.actions) ? state.config.actions.length : 0} Data action(s) available.`;
      loadData();
    }

    function setData(data, toolName) {
      state.data = data || {};
      render(toolName);
    }

    function renderLoading(toolName) {
      loadEl.disabled = true;
      statusLineEl.textContent = `Calling ${toolName} through the MCP Apps bridge...`;
      contentEl.innerHTML = '<div class="empty">Loading.</div>';
    }

    function render(toolName) {
      loadEl.disabled = false;
      const data = state.data;
      if (!data) {
        statusLineEl.textContent = "No data loaded.";
        contentEl.innerHTML = "";
        return;
      }
      if (data.ok === false) {
        statusLineEl.textContent = `${toolName || "Tool"} failed.`;
        contentEl.innerHTML = `<div class="empty">${escapeHtml(data.error || "Unknown error")}</div>`;
        return;
      }
      const rows = rowsFor(data);
      const total = data.total ?? data.counts?.total ?? rows.length;
      const returned = data.count ?? data.counts?.returned ?? rows.length;
      statusLineEl.textContent = `${toolName || "Tool"} returned ${returned} row(s). Total ${total}.`;
      if (typeof data.text === "string" && data.text.length) {
        contentEl.innerHTML = `<pre>${escapeHtml(data.text.slice(0, 20000))}</pre>`;
        return;
      }
      if (!rows.length) {
        contentEl.innerHTML = `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
        return;
      }
      renderTable(rows);
    }

    function rowsFor(data) {
      if (Array.isArray(data.items)) return data.items;
      if (Array.isArray(data.rows)) return data.rows;
      if (data.events || data.memories || data.relations || data.judgments) {
        return [
          { area: "events", ...flatten(data.events || {}) },
          { area: "memories", ...flatten(data.memories || {}) },
          { area: "relations", ...flatten(data.relations || {}) },
          { area: "judgments", ...flatten(data.judgments || {}) }
        ];
      }
      return [];
    }

    function flatten(value) {
      const out = {};
      for (const [key, item] of Object.entries(value || {})) {
        out[key] = typeof item === "object" && item !== null ? JSON.stringify(item) : item;
      }
      return out;
    }

    function renderTable(rows) {
      const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))].slice(0, 12);
      const body = rows.map((row) => `<tr>${columns.map((column) => `<td>${escapeHtml(formatCell(row[column]))}</td>`).join("")}</tr>`).join("");
      contentEl.innerHTML = `<div class="table-wrap"><table><thead><tr>${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function formatCell(value) {
      if (value === undefined || value === null) return "";
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function handleToolResult(payload) {
      const structured = payload && (payload.structuredContent || payload.params && payload.params.structuredContent);
      if (!structured) return;
      if (structured.actions && structured.view) setConfig(structured);
      else setData(structured, "tool-result");
    }

    window.addEventListener("message", (event) => {
      const message = event.data || {};
      if (message.jsonrpc === "2.0" && state.pending.has(message.id)) {
        const pending = state.pending.get(message.id);
        window.clearTimeout(pending.timeout);
        state.pending.delete(message.id);
        if (message.error) pending.reject(new Error(message.error.message || "Bridge tools/call failed"));
        else pending.resolve(message.result && (message.result.structuredContent || message.result));
        return;
      }
      if (message.method === "ui/notifications/tool-result") {
        handleToolResult(message.params || {});
      }
      if (message.method === "ui/notifications/tool-input" && message.params) {
        setConfig({ ...(state.config || {}), ...(message.params.structuredContent || message.params) });
      }
      if (message.type === "fixture") {
        setConfig(message.structuredContent || message.data);
      }
    });

    loadEl.addEventListener("click", loadData);
    viewEl.addEventListener("change", () => {
      offsetEl.value = "0";
      loadData();
    });
    if (window.openai && window.openai.toolOutput) setConfig(window.openai.toolOutput);
    else render();
  </script>
</body>
</html>
