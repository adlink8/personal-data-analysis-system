[pytest]
# Live automated tests only. Bare `python -m pytest` must not walk the
# whole repo (archives under _recycle/, integration/scripts helpers named
# test_*.py, etc.).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .hg
    .svn
    .tox
    .venv
    venv
    env
    dist
    build
    __pycache__
    node_modules
    _recycle
    .planning
    .gsd
    imports
    logs
    Agent
    Google
addopts = -q --import-mode=importlib
pythonpath = src
# Phase 20: keep pytest cache under var/ (not repo root)
cache_dir = var/cache/pytest
